; Furby 2012 ESP32 brain transplant
;
;   pio run                             build for ESP32-S3 (default)
;   pio run -t upload                   flash it
;   pio run -t uploadfs                 flash data/ (sound files) to LittleFS
;   pio run -e esp32dev ...             same, for an original ESP32
;   pio device monitor                  serial console (115200)
;   pio test -e native                  run host-side unit tests

[platformio]
default_envs = esp32s3

; Shared by both chips. Pinned to the Arduino-ESP32 2.0.x core: the code
; uses the 2.x LEDC and legacy I2S/PCNT driver APIs.
[esp32_common]
platform = espressif32@6.9.0
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
test_ignore = *

; ESP32-S3 (DevKitC-1 and most S3 boards with 8 MB+ flash). The console
; is on the native USB port (labelled "USB" on DevKitC-1).
[env:esp32s3]
extends = esp32_common
board = esp32-s3-devkitc-1
build_flags = -Wall -DARDUINO_USB_CDC_ON_BOOT=1

; Original ESP32 (WROOM-32 DevKitC and similar).
[env:esp32dev]
extends = esp32_common
board = esp32dev
build_flags = -Wall

[env:native]
platform = native
build_flags = -std=c++17 -Wall -Wextra
test_build_src = no
