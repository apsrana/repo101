; Furby 2012 ESP32 brain transplant
;
;   pio run -e esp32dev                 build firmware
;   pio run -e esp32dev -t upload       flash it
;   pio run -e esp32dev -t uploadfs     flash data/ (sound files) to LittleFS
;   pio device monitor                  serial console (115200)
;   pio test -e native                  run host-side unit tests

[platformio]
default_envs = esp32dev

[env:esp32dev]
; Pinned to the Arduino-ESP32 2.0.x core: the code uses the 2.x LEDC and
; legacy I2S driver APIs.
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags = -Wall
test_ignore = *

[env:native]
platform = native
build_flags = -std=c++17 -Wall -Wextra
test_build_src = no
